[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "cvcircuit"
version = "0.1.0"
description = "A small, readable Gaussian continuous-variable quantum optics simulator built on NumPy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonas Neergaard-Nielsen", email = "j@neer.dk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyter>=1.0", "nbconvert>=7.0"]

[project.urls]
Repository = "https://github.com/neago/CVcircuit"

[tool.uv.build-backend]
module-name = "cvcircuit"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
